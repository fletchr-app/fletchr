<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="44" fill="#1d3557"/>
  <!-- one colour: the C is the bow, the fine string is pulled back to the arrow's nock -->
  <g transform="translate(4 0)">
    <g transform="translate(10 0)">
      <path d="M138 34 A 70 70 0 1 0 138 166" fill="none" stroke="#f1faee" stroke-width="10" stroke-linecap="round"/>
      <path d="M138 34 L 164 100 L 138 166" fill="none" stroke="#f1faee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- gap in the C where the arrow passes (before the A, so the A stays whole) -->
    <path d="M72 112 H 8" stroke="#1d3557" stroke-width="22"/>
    <path d="M80 148 L 108 62 L 136 148" fill="none" stroke="#f1faee" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- arrow: the nock ends on the string (the string is at x=169 at this height) -->
    <path d="M165 112 H 16" stroke="#f1faee" stroke-width="8" stroke-linecap="round"/>
    <path d="M38 94 L 10 112 L 38 130 Z" fill="#f1faee" stroke="#f1faee" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
