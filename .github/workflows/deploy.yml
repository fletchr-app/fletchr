name: Deploy

# A release tag (vX.Y.Z on main, docs/releasing.md) updates the server: the checks first, then the server image is built
# and pushed to GHCR (ghcr.io/fletchr-app/fletchr-server:<tag>), then one SSH command makes the server pull and start it.
# The key can only run deploy/update.sh on the server (docs/self-hosting.md, section 5), which backs up, updates, checks
# that the new version answers, and puts the old one back if it does not. Nothing else deploys: not develop, not main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two releases at once would update the server twice at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # The image is built here, not on the server: the server only pulls it. The package must be public (once, in the
  # package settings on GitHub) for the server to pull it without a login.
  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          build-contexts: shared=shared
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fletchr-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # Secrets live in the environment "production" (Settings, Environments), where a required reviewer can be set.
    environment: production
    steps:
      - name: SSH key and the pinned host key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Update the server to ${{ github.ref_name }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          TAG: ${{ github.ref_name }}
        # The host key must match the pinned one; the tag is the whole command (the server accepts nothing but vX.Y.Z).
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "${PORT:-22}" "$DEPLOY_USER@$HOST" "$TAG"
