name: CI

# Every push to develop (where the work happens) and to main (releases), and every pull request.
on:
  push:
    branches: [develop, main]
  pull_request:
  # The release deploy (deploy.yml) runs the same checks before it touches the server.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build-only

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # --frozen: the tests run with exactly the versions in uv.lock
      - run: uv run --frozen pytest -q

  # The TypeScript types of the API are generated from the server's schema. A serializer change without
  # `npm run types:api` would leave the app with types that no longer match the server.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - run: npm ci
      - run: npm run types:api
      - name: The generated files are up to date
        run: git diff --exit-code src/lib/openapi.yaml src/lib/api-types.ts

  # The deploy scripts are tried against a fake server (a git remote and a fake docker): the part that runs on the real one
  # without anybody watching should not be written untested.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/tests/update_test.sh
