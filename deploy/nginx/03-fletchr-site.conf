# For plain nginx without a panel: fletchr.de (and www.) serve the static site from /var/www/fletchr,
# including the join page for invite links. Needs the certificate to cover these names and DNS records for
# fletchr.de and www. With a panel such as Plesk see docs/self-hosting.md, section 7, instead.
# fletchr.de     the landing page, the invite-link page, Impressum, privacy, account deletion

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fletchr.de;
    ssl_certificate     /etc/letsencrypt/live/fletchr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletchr/privkey.pem;
    return 301 https://fletchr.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fletchr.de;
    ssl_certificate     /etc/letsencrypt/live/fletchr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletchr/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/fletchr;
    index index.html;

    # Invite links: every /join/<code> is answered with the one join page, which reads the code itself.
    location /join/ {
        try_files /join/index.html =404;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer" always;
    }

    # Lets Android open the links in the app (see docs/self-hosting.md, section 7).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}

