# Step 1 (before there is a certificate): answers on port 80, lets certbot prove the domain, and sends
# everything else to HTTPS. Put it in /etc/nginx/conf.d/ (or sites-enabled). See SELFHOSTING.md.
server {
    listen 80;
    listen [::]:80;
    server_name app.fletchr.de;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
