# Step 2 (after `certbot certonly ... -d fletchr.de -d www.fletchr.de -d app.fletchr.de`): the real sites.
# fletchr.de     the landing page, the join page for invite links, legal texts (static files, /var/www/fletchr)
# app.fletchr.de the server the app talks to: Django on 127.0.0.1:8000 (docker-compose.prod.yml)

# Sign-in tries are limited per address (on top of what Django limits).
limit_req_zone $binary_remote_addr zone=fletchr_login:10m rate=10r/m;

# --- www and the plain domain -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fletchr.de;
    ssl_certificate     /etc/letsencrypt/live/fletchr.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletchr.de/privkey.pem;
    return 301 https://fletchr.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fletchr.de;
    ssl_certificate     /etc/letsencrypt/live/fletchr.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletchr.de/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/fletchr;
    index index.html;

    # Invite links: every /join/<code> is answered with the one join page, which reads the code itself.
    location /join/ {
        try_files /join/index.html =404;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer" always;
    }

    # Lets Android open the links in the app (see docs/deploy.md).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}

# --- the server -------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.fletchr.de;
    ssl_certificate     /etc/letsencrypt/live/fletchr.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletchr.de/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Photos and, later, videos are uploaded here.
    client_max_body_size 25m;

    # Nothing to see at the top: send people to the website.
    location = / {
        return 302 https://fletchr.de/;
    }

    location = /api/token/ {
        limit_req zone=fletchr_login burst=10 nodelay;
        include /etc/nginx/snippets/fletchr-proxy.conf;
    }

    # The admin: only from your own address(es). Replace the placeholder, or protect it with basic auth.
    location /admin/ {
        # allow 203.0.113.7;   # <- your IP
        # deny all;
        include /etc/nginx/snippets/fletchr-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/fletchr-proxy.conf;
    }
}
