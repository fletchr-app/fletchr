# Step 2 (after `certbot certonly ... --cert-name fletchr -d app.fletchr.de`): the server the app talks to.
# app.fletchr.de   Django on 127.0.0.1:8000 (docker-compose.prod.yml)
# The website on fletchr.de is a separate file, 03-fletchr-site.conf, for later.

# Sign-in tries are limited per address (on top of what Django limits).
limit_req_zone $binary_remote_addr zone=fletchr_login:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.fletchr.de;
    ssl_certificate     /etc/letsencrypt/live/fletchr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fletchr/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Photos and, later, videos are uploaded here.
    client_max_body_size 25m;

    # Nothing to see at the top. Once the website is live, make this: return 302 https://fletchr.de/;
    location = / {
        default_type text/plain;
        return 200 "Fletchr server\n";
    }

    location = /api/token/ {
        limit_req zone=fletchr_login burst=10 nodelay;
        include /etc/nginx/snippets/fletchr-proxy.conf;
    }

    # The admin: only from your own address(es). Replace the placeholder, or protect it with basic auth.
    location /admin/ {
        # allow 203.0.113.7;   # <- your IP
        # deny all;
        include /etc/nginx/snippets/fletchr-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/fletchr-proxy.conf;
    }
}
