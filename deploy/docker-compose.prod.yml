# Production on a server that already has nginx (or Apache) in front: only Django runs in Docker, on
# 127.0.0.1:8000, and the web server passes requests to it and ends HTTPS. See docs/self-hosting.md.
# Use:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# deploy/update.sh sets FLETCHR_IMAGE to the image CI built for a release (ghcr.io/fletchr-app/fletchr-server:<tag>) and pulls it;
# without it the image is built from this checkout.
services:
  django:
    image: ${FLETCHR_IMAGE:-fletchr-django}
    build:
      context: ../server
      additional_contexts:
        shared: ../shared
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in deploy/.env.prod}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in deploy/.env.prod}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_BEHIND_PROXY: "1"
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_SECURITY: ${DJANGO_EMAIL_SECURITY:-starttls}
      DJANGO_EMAIL_USER: ${DJANGO_EMAIL_USER:-}
      DJANGO_EMAIL_PASSWORD: ${DJANGO_EMAIL_PASSWORD:-}
      DJANGO_EMAIL_FROM: ${DJANGO_EMAIL_FROM:-Fletchr <noreply@fletchr.de>}
      # Three workers for two CPUs; a slow request does not block the others.
      # The access log shows the client's address (nginx passes it in X-Real-IP), not Docker's gateway.
      GUNICORN_CMD_ARGS: "--workers 3 --timeout 60 --access-logfile - --access-logformat '%({x-real-ip}i)s %(t)s \"%(r)s\" %(s)s %(b)s'"
    # Only the web server on the same machine may reach it (Docker would otherwise open the port to everybody).
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/django:/data
    # Logs rotate: the disk is not endless.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
