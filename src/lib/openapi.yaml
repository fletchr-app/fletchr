        setup:
          type: integer
          nullable: true
          description: The equipment setup of the session (see /api/setups/); null
            if none was recorded
        plotted:
          type: integer
          description: Arrows with a position (typed scores have none)
        centre_x:
          type: number
          format: double
          nullable: true
          description: Group centre, right is positive, 1 = the spot radius; null
            without positions
        centre_y:
          type: number
          format: double
          nullable: true
          description: Group centre, up is positive, 1 = the spot radius
        spread:
          type: number
          format: double
          nullable: true
          description: Mean distance of the arrows from the centre, 1 = the spot radius
        plotted_average:
          type: number
          format: double
          nullable: true
          description: Average points of the plotted arrows only; null below 6 plotted
            arrows
        centred_average:
          type: number
          format: double
          nullable: true
          description: Average of the plotted arrows with the group centre moved to
            the middle of the spot (a miss is 0); null below 6 plotted arrows. Not
            an official score
      required:
      - arrows
      - average
      - centre_x
      - centre_y
      - centred_average
      - competition
      - date
      - mental_rating
      - physical_rating
      - plotted
      - plotted_average
      - session
      - setup
      - spread
