openapi: 3.0.3
info:
  title: Archery Coach API
  version: 0.1.0
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/invites/redeem/:
    post:
      operationId: invites_redeem_create
      description: An existing user joins another team.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/register/:
    post:
      operationId: register_create
      description: 'Signup is invite-only: the invite code decides which team and
        role the new user gets.'
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/teams/:
    get:
      operationId: teams_list
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
  /api/teams/{team_id}/invites/:
    get:
      operationId: teams_invites_list
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
          description: ''
    post:
      operationId: teams_invites_create
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/teams/{team_id}/invites/{id}/:
    delete:
      operationId: teams_invites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/teams/{team_id}/members/:
    get:
      operationId: teams_members_list
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/teams/{team_id}/members/{user_id}/:
    delete:
      operationId: teams_members_destroy
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/blacklist/:
    post:
      operationId: token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    HandEnum:
      enum:
      - right
      - left
      type: string
      description: |-
        * `right` - Right
        * `left` - Left
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Invite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: archer
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - code
      - created_at
      - expires_at
      - id
      - used_at
    InviteRequest:
      type: object
      properties:
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: archer
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
      required:
      - email
      - id
      - profile
    Member:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - email
      - joined_at
      - name
      - role
      - user_id
    PatchedMeRequest:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/ProfileRequest'
    Profile:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        dominant_hand:
          oneOf:
          - $ref: '#/components/schemas/HandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        dominant_eye:
          oneOf:
          - $ref: '#/components/schemas/HandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        units:
          $ref: '#/components/schemas/UnitsEnum'
    ProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        dominant_hand:
          oneOf:
          - $ref: '#/components/schemas/HandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        dominant_eye:
          oneOf:
          - $ref: '#/components/schemas/HandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        units:
          $ref: '#/components/schemas/UnitsEnum'
    RedeemRequest:
      type: object
      properties:
        invite_code:
          type: string
          minLength: 1
      required:
      - invite_code
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
        invite_code:
          type: string
          minLength: 1
      required:
      - email
      - invite_code
      - name
      - password
    RegisterResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    RoleEnum:
      enum:
      - archer
      - coach
      - admin
      type: string
      description: |-
        * `archer` - Archer
        * `coach` - Coach
        * `admin` - Admin
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        my_role:
          type: string
          readOnly: true
      required:
      - id
      - my_role
      - name
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UnitsEnum:
      enum:
      - metric
      - imperial
      type: string
      description: |-
        * `metric` - Metric
        * `imperial` - Imperial
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
