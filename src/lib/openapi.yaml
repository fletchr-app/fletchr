          type: string
          format: uuid
          writeOnly: true
          nullable: true
        arrow_set_revision_uid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        physical_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        mental_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        goals:
          type: string
        notes:
          type: string
        event:
          type: string
          format: uuid
          nullable: true
          description: The team training this is part of; send null to take it out
        event_slot:
          type: string
          format: uuid
          writeOnly: true
          description: 'With `event_date`: the slot, when `event` is the id of an
            occurrence that has no row yet'
        event_date:
          type: string
          format: date
          writeOnly: true
          description: 'With `event_slot`: the date of the occurrence in the time
            zone of the slot'
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityA4eEnum'
          description: |-
            Who sees the session: `me` or `coaches`. Left out: your default for new sessions (`coaches` for a session a coach opens). Only the archer chooses.

            * `me` - me
            * `coaches` - coaches
            * `team` - team
            * `everyone` - everyone
