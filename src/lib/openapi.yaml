openapi: 3.0.3
info:
  title: Archery Coach API
  version: 0.1.0
paths:
  /api/arrow-sets/:
    get:
      operationId: arrow_sets_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSet'
          description: ''
    post:
      operationId: arrow_sets_create
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
  /api/arrow-sets/{id}/:
    get:
      operationId: arrow_sets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    put:
      operationId: arrow_sets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    patch:
      operationId: arrow_sets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    delete:
      operationId: arrow_sets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/arrow-sets/{id}/revisions/:
    get:
      operationId: arrow_sets_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSetRevision'
          description: ''
  /api/bows/:
    get:
      operationId: bows_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bow'
          description: ''
    post:
      operationId: bows_create
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
  /api/bows/{id}/:
    get:
      operationId: bows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    put:
      operationId: bows_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    patch:
      operationId: bows_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    delete:
      operationId: bows_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bows/{id}/revisions/:
    get:
      operationId: bows_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BowRevision'
          description: ''
  /api/faces/:
    get:
      operationId: faces_list
      tags:
      - faces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Face'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/invites/redeem/:
    post:
      operationId: invites_redeem_create
      description: An existing user joins another team.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/notes/:
    get:
      operationId: notes_list
      parameters:
      - in: query
        name: archer
        schema:
          type: integer
      - in: query
        name: author
        schema:
          type: integer
      - in: query
        name: end
        schema:
          type: string
          format: uuid
      - in: query
        name: session
        schema:
          type: string
          format: uuid
      - in: query
        name: team
        schema:
          type: integer
      - in: query
        name: visibility
        schema:
          type: string
          enum:
          - coach_only
          - shared
        description: |-
          * `coach_only` - Coach Only
          * `shared` - Shared
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
          description: ''
    post:
      operationId: notes_create
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/notes/{id}/:
    get:
      operationId: notes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this note.
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    patch:
      operationId: notes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this note.
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNoteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    delete:
      operationId: notes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this note.
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/notes/teams/:
    get:
      operationId: notes_teams_list
      description: Where I may write notes about this archer. Empty if I am not their
        coach.
      parameters:
      - in: query
        name: archer
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteTeam'
          description: ''
  /api/register/:
    post:
      operationId: register_create
      description: 'Signup is invite-only: the invite code decides which team and
        role the new user gets.'
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/sessions/:
    get:
      operationId: sessions_list
      description: 'Sessions you may see: your own and those of the archers you coach,
        newest first, with totals.'
      parameters:
      - in: query
        name: environment
        schema:
          type: string
          enum:
          - indoor
          - outdoor
        description: |-
          * `indoor` - Indoor
          * `outdoor` - Outdoor
      - in: query
        name: owner
        schema:
          type: integer
      - in: query
        name: started_after
        schema:
          type: string
          format: date-time
      - in: query
        name: started_before
        schema:
          type: string
          format: date-time
      - in: query
        name: type
        schema:
          type: string
          enum:
          - competition
          - scoring
          - technique
          - volume
        description: |-
          * `scoring` - Scoring
          * `volume` - Volume
          * `technique` - Technique
          * `competition` - Competition
      - in: query
        name: updated_after
        schema:
          type: string
          format: date-time
      tags:
      - sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
          description: ''
  /api/sessions/{session_id}/:
    get:
      operationId: sessions_retrieve
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    put:
      operationId: sessions_update
      description: Create the session with this id, or update it. Safe to repeat.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    delete:
      operationId: sessions_destroy
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/sessions/{session_id}/ends/{end_id}/:
    put:
      operationId: sessions_ends_update
      description: Create or replace one end with all its shots. The server fills
        in the scores. Safe to repeat.
      parameters:
      - in: path
        name: end_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EndRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EndRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/End'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/End'
          description: ''
    delete:
      operationId: sessions_ends_destroy
      parameters:
      - in: path
        name: end_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/sessions/{session_id}/volume/{entry_id}/:
    put:
      operationId: sessions_volume_update
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VolumeEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VolumeEntryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeEntry'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeEntry'
          description: ''
    delete:
      operationId: sessions_volume_destroy
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/setups/:
    get:
      operationId: setups_list
      description: Setups are immutable. Posting a pair of revisions returns the existing
        setup for it if there is one.
      parameters:
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - setups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setup'
          description: ''
    post:
      operationId: setups_create
      description: Setups are immutable. Posting a pair of revisions returns the existing
        setup for it if there is one.
      tags:
      - setups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
          description: ''
  /api/setups/{id}/:
    get:
      operationId: setups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - setups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
          description: ''
  /api/teams/:
    get:
      operationId: teams_list
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
  /api/teams/{team_id}/invites/:
    get:
      operationId: teams_invites_list
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
          description: ''
    post:
      operationId: teams_invites_create
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/teams/{team_id}/invites/{id}/:
    delete:
      operationId: teams_invites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/teams/{team_id}/members/:
    get:
      operationId: teams_members_list
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/teams/{team_id}/members/{user_id}/:
    delete:
      operationId: teams_members_destroy
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/teams/{team_id}/membership/:
    patch:
      operationId: teams_membership_partial_update
      description: My own settings in a team. Only I can change them.
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMembershipSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembershipSettingsRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSettings'
          description: ''
  /api/teams/{team_id}/overview/:
    get:
      operationId: teams_overview_list
      description: |-
        For coaches: each archer of the team (and each coach who shares their training) with their latest
        session and arrows of the last 7 days.
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArcherOverview'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/blacklist/:
    post:
      operationId: token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
