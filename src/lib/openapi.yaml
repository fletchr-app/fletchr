openapi: 3.0.3
info:
  title: Fletchr API
  version: 0.18.0
paths:
  /api/archers/{user_id}/:
    get:
      operationId: archers_retrieve
      description: Who this is, for an archer whose training I may see.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - archers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archer'
          description: ''
  /api/archers/{user_id}/video-consent/:
    put:
      operationId: archers_video_consent_update
      description: A coach records that the parents of an archer under 18 consented
        to video, or withdraws that. Without it no video of the archer is added.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - archers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoConsent'
          description: ''
    delete:
      operationId: archers_video_consent_destroy
      description: 'Withdrawn: new video is refused again. Clips that exist stay until
        someone deletes them.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - archers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/arrow-sets/:
    get:
      operationId: arrow_sets_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSet'
          description: ''
    post:
      operationId: arrow_sets_create
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
  /api/arrow-sets/{id}/:
    get:
      operationId: arrow_sets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    put:
      operationId: arrow_sets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    patch:
      operationId: arrow_sets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    delete:
      operationId: arrow_sets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/arrow-sets/{id}/revisions/:
    get:
      operationId: arrow_sets_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSetRevision'
          description: ''
  /api/arrow-sets/{uid}/:
    put:
      operationId: arrow_sets_update_2
      description: |-
        Create or update an item by the uid the app gave it. Safe to repeat: the same values add no revision.

        The body may carry `revision_uid`, the uid the app gave the revision these values make; it is used if the values
        are new. Only the owner can write: an item of somebody else is answered like one that does not exist.
      parameters:
      - in: path
        name: uid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetPutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetPutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetPutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: Sign in with a Google ID token. With an invite or claim code it
        registers a new account instead (never without one).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/bows/:
    get:
      operationId: bows_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bow'
          description: ''
    post:
      operationId: bows_create
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
  /api/bows/{id}/:
    get:
      operationId: bows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    put:
      operationId: bows_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    patch:
      operationId: bows_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    delete:
      operationId: bows_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bows/{id}/revisions/:
    get:
      operationId: bows_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BowRevision'
          description: ''
  /api/bows/{uid}/:
    put:
      operationId: bows_update_2
      description: |-
        Create or update an item by the uid the app gave it. Safe to repeat: the same values add no revision.

        The body may carry `revision_uid`, the uid the app gave the revision these values make; it is used if the values
        are new. Only the owner can write: an item of somebody else is answered like one that does not exist.
      parameters:
      - in: path
        name: uid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowPutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowPutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowPutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
  /api/claims/redeem/:
    post:
      operationId: claims_redeem_create
      description: An archer takes over a profile that a coach kept for them.
      tags:
      - claims
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/codes/preview/:
    post:
      operationId: codes_preview_create
      description: What a code would do, so the screen can ask for confirmation first.
        Open to everybody (the code is the secret).
      tags:
      - codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodePreview'
          description: ''
  /api/devices/:
    put:
      operationId: devices_update
      description: |-
        Register this phone, or tell the server it is still there. Safe to repeat. A token that belongs to another person moves
        to the caller (the phone changed account).
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '201':
          description: No response body
    delete:
      operationId: devices_destroy
      description: Remove this phone. Only the caller's own; a token that is unknown
        or someone else's is answered the same.
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/evaluation-templates/{id}/:
    get:
      operationId: evaluation_templates_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - evaluation-templates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
    put:
      operationId: evaluation_templates_update
      description: Change the name or the criteria. A change makes a new version;
        evaluations made before keep the one they were made with.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - evaluation-templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
    delete:
      operationId: evaluation_templates_destroy
      description: 'Only a form without evaluations: the others are kept, so that
        what was rated stays readable.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - evaluation-templates
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          description: No response body
  /api/evaluations/:
    get:
      operationId: evaluations_list
      parameters:
      - in: query
        name: archer
        schema:
          type: integer
      - in: query
        name: author
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - coach
          - self
        description: |-
          * `coach` - Coach
          * `self` - Self
      - in: query
        name: team
        schema:
          type: integer
      tags:
      - evaluations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
          description: ''
    post:
      operationId: evaluations_create
      tags:
      - evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
  /api/evaluations/{id}/:
    get:
      operationId: evaluations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation.
        required: true
      tags:
      - evaluations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
    patch:
      operationId: evaluations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation.
        required: true
      tags:
      - evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvaluationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEvaluationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEvaluationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
    delete:
      operationId: evaluations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation.
        required: true
      tags:
      - evaluations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{event_id}/:
    get:
      operationId: events_retrieve
      description: 'A training that is a row. The id of an occurrence nobody linked
        to is a 404: see the agenda.'
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    put:
      operationId: events_update
      description: |-
        Create the event with this id, or change it (cancel it, move it). Safe to repeat. Coaches and admins of the team.

        A one-off (competition, extra training, camp) needs `team`, `start` and `end`. The occurrence of a slot has
        no row until someone links to it: send `slot` and `date` and the id from the agenda to make it a row, with
        or without changes. It cannot be cancelled while sessions, notes or media are linked to it (409).
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: events_destroy
      description: Delete a one-off nothing is linked to. A training from a slot is
        cancelled instead.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{event_id}/archers/:
    get:
      operationId: events_archers_list
      description: |-
        The archers who took part in the event, as far as anything shows it: a linked session, a note or a photo or video.
        Coaches of the team only.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventArcher'
          description: ''
  /api/events/{event_id}/attach/:
    post:
      operationId: events_attach_create
      description: |-
        Put what an archer has in this event and in no session into one of their sessions. The rows keep their `event`.

        For the archer who owns the session, and for coaches of the event's team. Safe to repeat: rows that are in a session
        already are left alone. Only what you may see is moved.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachResult'
          description: ''
  /api/events/agenda/:
    get:
      operationId: events_agenda_list
      description: 'What happens in your teams in a period: slots'' occurrences and
        events, by start time. Cancelled ones are listed with `cancelled`.'
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: A date or a time
        required: true
      - in: query
        name: team
        schema:
          type: integer
        description: 'Only this team; default: all your teams'
      - in: query
        name: to
        schema:
          type: string
        description: A date or a time, at most 120 days after `from`
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
