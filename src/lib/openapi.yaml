openapi: 3.0.3
info:
  title: Archery Coach API
  version: 0.1.0
paths:
  /api/arrow-sets/:
    get:
      operationId: arrow_sets_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSet'
          description: ''
    post:
      operationId: arrow_sets_create
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
  /api/arrow-sets/{id}/:
    get:
      operationId: arrow_sets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    put:
      operationId: arrow_sets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    patch:
      operationId: arrow_sets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    delete:
      operationId: arrow_sets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/arrow-sets/{id}/revisions/:
    get:
      operationId: arrow_sets_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSetRevision'
          description: ''
  /api/bows/:
    get:
      operationId: bows_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bow'
          description: ''
    post:
      operationId: bows_create
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
  /api/bows/{id}/:
    get:
      operationId: bows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    put:
      operationId: bows_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    patch:
      operationId: bows_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    delete:
      operationId: bows_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bows/{id}/revisions/:
    get:
      operationId: bows_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BowRevision'
          description: ''
  /api/faces/:
    get:
      operationId: faces_list
      tags:
      - faces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Face'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/invites/redeem/:
    post:
      operationId: invites_redeem_create
      description: An existing user joins another team.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/register/:
    post:
      operationId: register_create
      description: 'Signup is invite-only: the invite code decides which team and
        role the new user gets.'
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/setups/:
    get:
      operationId: setups_list
      description: Setups are immutable. Posting a pair of revisions returns the existing
        setup for it if there is one.
      parameters:
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - setups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setup'
          description: ''
    post:
      operationId: setups_create
      description: Setups are immutable. Posting a pair of revisions returns the existing
        setup for it if there is one.
      tags:
      - setups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
          description: ''
  /api/setups/{id}/:
    get:
      operationId: setups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - setups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
          description: ''
  /api/teams/:
    get:
      operationId: teams_list
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
  /api/teams/{team_id}/invites/:
    get:
      operationId: teams_invites_list
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
          description: ''
    post:
      operationId: teams_invites_create
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/teams/{team_id}/invites/{id}/:
    delete:
      operationId: teams_invites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/teams/{team_id}/members/:
    get:
      operationId: teams_members_list
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/teams/{team_id}/members/{user_id}/:
    delete:
      operationId: teams_members_destroy
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/blacklist/:
    post:
      operationId: token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    ArrowSet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        revision:
          type: integer
          readOnly: true
        revision_number:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        shaft_model:
          type: string
          maxLength: 150
        spine:
          type: string
          maxLength: 50
        length:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: Arrow length in inches
        point_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Point weight in grain
        nock:
          type: string
          maxLength: 150
        fletching:
          type: string
          maxLength: 150
        count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        notes:
          type: string
      required:
      - created_at
      - id
      - name
      - owner
      - revision
      - revision_number
    ArrowSetRequest:
      type: object
      properties:
        is_active:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 150
        shaft_model:
          type: string
          maxLength: 150
        spine:
          type: string
          maxLength: 50
        length:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: Arrow length in inches
        point_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Point weight in grain
        nock:
          type: string
          maxLength: 150
        fletching:
          type: string
          maxLength: 150
        count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        notes:
          type: string
      required:
      - name
    ArrowSetRevision:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        arrow_set:
          type: integer
        number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 150
        shaft_model:
          type: string
          maxLength: 150
        spine:
          type: string
          maxLength: 50
        length:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: Arrow length in inches
        point_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Point weight in grain
        nock:
          type: string
          maxLength: 150
        fletching:
          type: string
          maxLength: 150
        count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        notes:
          type: string
      required:
      - arrow_set
      - created_at
      - id
      - name
      - number
    ArrowSetRevisionRequest:
      type: object
      properties:
        arrow_set:
          type: integer
        number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 150
        shaft_model:
          type: string
          maxLength: 150
        spine:
          type: string
          maxLength: 50
        length:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: Arrow length in inches
        point_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
