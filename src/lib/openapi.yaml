components:
  schemas:
    AccountBlocked:
      type: object
      properties:
        detail:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/BlockingTeam'
      required:
      - detail
      - teams
    Archer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        managed:
          type: boolean
          description: A profile kept by a coach, without an account
        team_id:
          type: integer
          nullable: true
          description: A team you coach that the archer is in
        team_name:
          type: string
          nullable: true
      required:
      - id
      - managed
      - name
      - team_id
      - team_name
    ArcherNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
    ArcherOverview:
      type: object
      properties:
        user_id:
          type: integer
        role:
          type: string
          description: archer, or coach/admin for a coach who shares their training
        name:
          type: string
        managed:
          type: boolean
          description: A profile kept by a coach, without an account
        last_session:
          allOf:
          - $ref: '#/components/schemas/LastSession'
          nullable: true
        arrows_7d:
          type: integer
          description: Arrows shot in sessions started in the last 7 days
      required:
      - arrows_7d
      - last_session
      - managed
      - name
      - role
      - user_id
    ArrowSet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        revision:
          type: integer
          readOnly: true
        revision_number:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        shaft_model:
          type: string
          maxLength: 150
        spine:
          type: string
          maxLength: 50
        length:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
          description: Arrow length in inches
        point_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Point weight in grain
        nock:
          type: string
          maxLength: 150
        fletching:
          type: string
          maxLength: 150
        count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        notes:
          type: string
      required:
      - created_at
      - id
      - name
      - owner
      - revision
      - revision_number
