              $ref: '#/components/schemas/PatchedMembershipSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMembershipSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembershipSettingsRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSettings'
          description: ''
    delete:
      operationId: teams_membership_destroy
      description: Leave the team. Your sessions and equipment stay yours; a team
        keeps at least one admin.
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/teams/{team_id}/overview/:
    get:
      operationId: teams_overview_list
      description: |-
        For coaches: each archer of the team (and each coach who shares their training) with their latest
        session and arrows of the last 7 days.
      parameters:
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArcherOverview'
          description: ''
  /api/teams/{team_id}/ranking/:
    get:
      operationId: teams_ranking_retrieve
      description: 'For coaches, when an admin has switched it on: how many arrows
        each archer shot lately and their average on one face and distance.'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: How far back, 1 to 365; default 28
      - in: query
        name: distance_m
        schema:
          type: number
          format: double
        description: Distance for the average; needed with face
      - in: query
        name: face
        schema:
          type: string
        description: 'Slug of the face for the average; default: the one shot most'
      - in: path
        name: team_id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ranking'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/blacklist/:
    post:
      operationId: token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: 'simplejwt crashes (500) when the account behind a refresh token
        has been deleted: refuse it (401) instead.'
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/{user_id}/avatar/:
    get:
      operationId: users_avatar_retrieve
      description: |-
        The picture itself. The <img> element cannot send the sign-in header, so the link carries a token (one viewer,
        one person, an hour); the sign-in header works too. Every refusal is the same 404.
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: From `avatar_url`; not needed with the sign-in header
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
