          readOnly: true
        scored_arrows:
          type: integer
          readOnly: true
        score_total:
          type: integer
          readOnly: true
        volume_arrows:
          type: integer
          readOnly: true
      required:
      - ends
      - id
      - owner
      - owner_name
      - score_total
      - scored_arrows
      - started_at
      - type
      - updated_at
      - volume_arrows
    SessionTypeEnum:
      enum:
      - scoring
      - volume
      - technique
      - competition
      type: string
      description: |-
        * `scoring` - Scoring
        * `volume` - Volume
        * `technique` - Technique
        * `competition` - Competition
    SessionWriteRequest:
      type: object
      description: |-
        The equipment is chosen by revision: the app knows the revision ids from its stored copy of your
        equipment, and the server finds or creates the setup for that pair. Leave both out to keep the
        session's equipment as it is; send null to clear it.
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        type:
          $ref: '#/components/schemas/SessionTypeEnum'
        environment:
          oneOf:
          - $ref: '#/components/schemas/EnvironmentEnum'
          - $ref: '#/components/schemas/BlankEnum'
        location:
          type: string
          maxLength: 150
        weather:
          type: string
          maxLength: 150
        bow_revision:
          type: integer
          nullable: true
        arrow_set_revision:
          type: integer
          nullable: true
        physical_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        mental_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        goals:
          type: string
        notes:
          type: string
      required:
      - started_at
      - type
    Setup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        bow_revision:
          type: integer
        arrow_set_revision:
          type: integer
          nullable: true
        bow:
          allOf:
          - $ref: '#/components/schemas/BowRevision'
          readOnly: true
        arrow_set:
          allOf:
          - $ref: '#/components/schemas/ArrowSetRevision'
          readOnly: true
      required:
      - arrow_set
      - bow
      - bow_revision
      - created_at
      - id
      - owner
    SetupInfo:
      type: object
      description: The equipment of a session, as it was when the session used it.
      properties:
        bow_name:
          type: string
        bow_type:
          type: string
        bow_revision:
          type: integer
        bow_revision_number:
          type: integer
        arrow_set_name:
          type: string
          nullable: true
        arrow_set_revision:
          type: integer
          nullable: true
        arrow_set_revision_number:
          type: integer
          nullable: true
      required:
      - arrow_set_name
      - arrow_set_revision
      - arrow_set_revision_number
      - bow_name
      - bow_revision
      - bow_revision_number
      - bow_type
    SetupRequest:
      type: object
      properties:
        bow_revision:
          type: integer
        arrow_set_revision:
          type: integer
          nullable: true
      required:
      - bow_revision
    Shot:
      type: object
      description: 'What the app sends for a shot. The score fields are advisory:
        the server works out its own.'
      properties:
        id:
          type: string
          format: uuid
        spot:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        x:
          type: number
          format: double
          nullable: true
        y:
          type: number
          format: double
          nullable: true
        value:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        is_x:
          type: boolean
        is_miss:
          type: boolean
        is_manual:
          type: boolean
          readOnly: true
        arrow_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
      required:
      - id
      - is_manual
    ShotRequest:
      type: object
      description: 'What the app sends for a shot. The score fields are advisory:
        the server works out its own.'
      properties:
        id:
          type: string
          format: uuid
        spot:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        x:
          type: number
          format: double
          nullable: true
        y:
          type: number
          format: double
          nullable: true
        value:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        is_x:
          type: boolean
        is_miss:
          type: boolean
        arrow_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
