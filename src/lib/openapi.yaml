openapi: 3.0.3
info:
  title: Fletchr API
  version: 0.6.1
paths:
  /api/archers/{user_id}/:
    get:
      operationId: archers_retrieve
      description: Who this is, for an archer whose training I may see.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - archers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archer'
          description: ''
  /api/archers/{user_id}/video-consent/:
    put:
      operationId: archers_video_consent_update
      description: A coach records that the parents of an archer under 18 consented
        to video, or withdraws that. Without it no video of the archer is added.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - archers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoConsent'
          description: ''
    delete:
      operationId: archers_video_consent_destroy
      description: 'Withdrawn: new video is refused again. Clips that exist stay until
        someone deletes them.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - archers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/arrow-sets/:
    get:
      operationId: arrow_sets_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSet'
          description: ''
    post:
      operationId: arrow_sets_create
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
  /api/arrow-sets/{id}/:
    get:
      operationId: arrow_sets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    put:
      operationId: arrow_sets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArrowSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    patch:
      operationId: arrow_sets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArrowSetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrowSet'
          description: ''
    delete:
      operationId: arrow_sets_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/arrow-sets/{id}/revisions/:
    get:
      operationId: arrow_sets_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this arrow set.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - arrow-sets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrowSetRevision'
          description: ''
  /api/bows/:
    get:
      operationId: bows_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bow'
          description: ''
    post:
      operationId: bows_create
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
  /api/bows/{id}/:
    get:
      operationId: bows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    put:
      operationId: bows_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    patch:
      operationId: bows_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBowRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bow'
          description: ''
    delete:
      operationId: bows_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bows/{id}/revisions/:
    get:
      operationId: bows_revisions_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bow.
        required: true
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: owner
        schema:
          type: integer
      tags:
      - bows
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BowRevision'
          description: ''
  /api/claims/redeem/:
    post:
      operationId: claims_redeem_create
      description: An archer takes over a profile that a coach kept for them.
      tags:
      - claims
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/codes/preview/:
    post:
      operationId: codes_preview_create
      description: What a code would do, so the screen can ask for confirmation first.
        Open to everybody (the code is the secret).
      tags:
      - codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodePreview'
          description: ''
  /api/evaluation-templates/{id}/:
    get:
      operationId: evaluation_templates_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - evaluation-templates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
    put:
      operationId: evaluation_templates_update
      description: Change the name or the criteria. A change makes a new version;
        evaluations made before keep the one they were made with.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - evaluation-templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
    delete:
      operationId: evaluation_templates_destroy
      description: 'Only a form without evaluations: the others are kept, so that
        what was rated stays readable.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - evaluation-templates
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          description: No response body
  /api/evaluations/:
    get:
      operationId: evaluations_list
      parameters:
      - in: query
        name: archer
        schema:
          type: integer
      - in: query
        name: author
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - coach
          - self
        description: |-
          * `coach` - Coach
          * `self` - Self
      - in: query
        name: team
        schema:
          type: integer
      tags:
      - evaluations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evaluation'
          description: ''
    post:
      operationId: evaluations_create
      tags:
      - evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
  /api/evaluations/{id}/:
    get:
      operationId: evaluations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation.
        required: true
      tags:
      - evaluations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
    patch:
      operationId: evaluations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation.
        required: true
      tags:
      - evaluations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvaluationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEvaluationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEvaluationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
          description: ''
    delete:
      operationId: evaluations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation.
        required: true
      tags:
      - evaluations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/faces/:
    get:
      operationId: faces_list
      tags:
      - faces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Face'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/invites/redeem/:
    post:
      operationId: invites_redeem_create
      description: An existing user joins another team.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/delete-account/:
    post:
      operationId: me_delete_account_create
      description: Erase my account and all my data, for good. Needs my password.
        Refused while I am the only admin of a team others are in.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBlocked'
          description: ''
  /api/me/delete-data/:
    post:
      operationId: me_delete_data_create
      description: Erase my sessions, equipment and the coach notes about me, for
        good. Needs my password.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDataRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteDataRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteDataRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDataResponse'
          description: ''
  /api/me/email/:
    post:
      operationId: me_email_create
      description: 'Set a new email address (it is the login name). Takes effect at
        once: the server cannot send mail yet.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/export/:
    post:
      operationId: me_export_create
      description: Everything the server has about me, as one JSON document. Needs
        my password.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/me/export/media/:
    post:
      operationId: me_export_media_create
      description: A link to a zip of my photos and videos. Needs my password. The
        files are big, so the zip is fetched by the link, not in this answer.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaExportLink'
          description: ''
  /api/me/export/media/file/:
    get:
      operationId: me_export_media_file_retrieve
      description: The zip. The link carries a token because a browser opens it, without
        the sign-in header.
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: From the link
      tags:
      - me
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: ''
  /api/me/password/:
    post:
      operationId: me_password_create
      description: Set a new password. Every other session of the account is signed
        out; this one gets new tokens.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/media/:
    get:
      operationId: media_list
      description: 'Photos and videos you may see: your own and those of the archers
        you coach, newest first.'
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - photo
          - video
        description: |-
          * `photo` - Photo
          * `video` - Video
      - in: query
        name: owner
        schema:
          type: integer
      - in: query
        name: session
        schema:
          type: string
          format: uuid
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'
          description: ''
  /api/media/{media_id}/:
    get:
      operationId: media_retrieve
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
    put:
      operationId: media_update
      description: 'Upload the clip with this id, or change its note and session.
        Safe to repeat: the files of a clip that exists are not replaced.'
      parameters:
      - in: path
